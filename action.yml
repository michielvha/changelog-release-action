name: 'Changelog Release'
description: 'Generate changelog from conventional commits and create a GitHub Release'

inputs:
  version:
    description: 'Release version (tag name)'
    required: true
  type:
    description: 'Artifact type for the release footer: docker or helm'
    required: false
    default: 'docker'

runs:
  using: composite
  steps:
    - name: Ensure full git history
      shell: bash
      run: |
        git fetch --unshallow 2>/dev/null || true
        git fetch --tags --force

    - name: Generate changelog
      id: changelog
      uses: orhun/git-cliff-action@v4.7.0
      with:
        config: ${{ github.action_path }}/cliff.toml
        args: --latest --strip header --output /tmp/changelog.md
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Build release body
      shell: bash
      run: |
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        VERSION="${{ inputs.version }}"
        TYPE="${{ inputs.type }}"
        ACTION_PATH="${{ github.action_path }}"

        # Convert plain commit hashes to linked hashes
        # Matches the cliff.toml output format: "- abc1234 : message"
        sed -i -E "s/^- ([a-f0-9]{7}) :/- [\`\1\`](https:\/\/github.com\/${OWNER}\/${REPO}\/commit\/\1) :/g" /tmp/changelog.md

        cp /tmp/changelog.md /tmp/release-body.md

        # Add "Full Changelog" comparison link
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "" >> /tmp/release-body.md
          echo "**Full Changelog**: [\`${PREV_TAG}...${VERSION}\`](https://github.com/${OWNER}/${REPO}/compare/${PREV_TAG}...${VERSION})" >> /tmp/release-body.md
        fi

        # Add artifact info
        echo "" >> /tmp/release-body.md
        if [ "$TYPE" = "helm" ]; then
          CHART_NAME="${REPO%-helm}"
          cat >> /tmp/release-body.md <<EOF
        ---

        ### Install

        \`\`\`bash
        helm install ${CHART_NAME} oci://ghcr.io/${OWNER}/charts/${CHART_NAME} --version ${VERSION}
        \`\`\`
        EOF
        else
          cat >> /tmp/release-body.md <<EOF
        ---

        ### Container Image

        \`\`\`bash
        docker pull ghcr.io/${OWNER}/${REPO}:${VERSION}
        \`\`\`

        **Platforms:** \`linux/amd64\`, \`linux/arm64\`
        EOF
        fi

        # Add branding
        cat >> /tmp/release-body.md <<EOF

        <div align="center">
          <img src="https://raw.githubusercontent.com/michielvha/changelog-release-action/main/assets/logo.png" width="100" />
        </div>
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.6.2
      with:
        tag_name: ${{ inputs.version }}
        name: ${{ inputs.version }}
        body_path: /tmp/release-body.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ github.token }}
